# /etc/apache2/sites-available/skinmrkt.conf
#
# Apache2 vhost for SKIN.MRKT on Ubuntu 24.04 LTS (Noble).
#
# Assumes:
#   - React production build is at /var/www/skinmrkt (contents of frontend/build/)
#   - FastAPI backend runs on 127.0.0.1:8000 (via systemd — deploy/skinmrkt-backend.service)
#   - SSL certs are managed by certbot at /etc/letsencrypt/live/example-domain.com/
#
# Required Apache modules — enable once with:
#   sudo a2enmod proxy proxy_http rewrite headers deflate ssl expires
#
# Enable this site with:
#   sudo cp deploy/apache-skinmrkt.conf /etc/apache2/sites-available/skinmrkt.conf
#   sudo a2ensite skinmrkt.conf
#   sudo a2dissite 000-default.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Replace example-domain.com everywhere below with your actual domain.

# ==== HTTP -> HTTPS redirect ====
<VirtualHost *:80>
    ServerName example-domain.com
    ServerAlias www.example-domain.com

    # Allow certbot to renew certs
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# ==== HTTPS main site ====
<VirtualHost *:443>
    ServerName example-domain.com
    ServerAlias www.example-domain.com

    DocumentRoot /var/www/skinmrkt

    # ---- SSL (obtain with: sudo certbot --apache -d example-domain.com -d www.example-domain.com) ----
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/example-domain.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/example-domain.com/privkey.pem
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLHonorCipherOrder     on

    # ---- Security headers ----
    Header always set X-Frame-Options            "SAMEORIGIN"
    Header always set X-Content-Type-Options     "nosniff"
    Header always set Referrer-Policy            "strict-origin-when-cross-origin"
    Header always set Permissions-Policy         "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security  "max-age=63072000; includeSubDomains"

    # ---- Gzip ----
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>

    # ---- Upload / body size (25 MB) ----
    LimitRequestBody 26214400

    # ---- Reverse-proxy /api/ AND /webhook/stripe to FastAPI on 127.0.0.1:8000 ----
    # ProxyPass ORDER MATTERS — more specific paths must come first.
    ProxyPreserveHost On
    ProxyPass        /api/            http://127.0.0.1:8000/api/
    ProxyPassReverse /api/            http://127.0.0.1:8000/api/
    # If you also expose Steam OpenID callback via a non-/api path, add it here.

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-For   "%{REMOTE_ADDR}s"

    # ---- Long-cache the hashed CRA static bundles ----
    <Directory "/var/www/skinmrkt/static">
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </Directory>

    # ---- Short-cache the favicon / images / manifest ----
    <FilesMatch "\.(ico|png|jpg|jpeg|gif|webp|svg|txt|webmanifest|json)$">
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
        Header set Cache-Control "public"
    </FilesMatch>

    # ---- React Router SPA fallback ----
    <Directory "/var/www/skinmrkt">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # index.html itself must NOT be cached — always serve the newest bundle references.
        <Files "index.html">
            Header set Cache-Control "no-store, no-cache, must-revalidate"
        </Files>

        # Any URL that isn't a real file OR the /api reverse-proxy falls back to index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # ---- Deny access to hidden files (.env, .git, .htaccess, etc.) ----
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/skinmrkt-error.log
    CustomLog ${APACHE_LOG_DIR}/skinmrkt-access.log combined
</VirtualHost>
