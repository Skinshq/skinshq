# /etc/nginx/sites-available/skinmrkt.conf
#
# Nginx site config for SKIN.MRKT on Ubuntu 26.04 (Resolute).
#
# Assumes:
#   - The React production build is copied to /var/www/skinmrkt (contents of `frontend/build/`)
#   - The FastAPI backend runs on 127.0.0.1:8001 (via systemd — see /deploy/skinmrkt-backend.service)
#   - SSL certs are managed by certbot at /etc/letsencrypt/live/example-domain.com/
#
# After copying to /etc/nginx/sites-available/, enable with:
#   sudo ln -s /etc/nginx/sites-available/skinmrkt.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace example-domain.com with your actual domain everywhere below.

# ---- HTTP -> HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name example-domain.com www.example-domain.com;

    # Let certbot renew certs without disrupting service
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS main site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example-domain.com www.example-domain.com;

    root /var/www/skinmrkt;
    index index.html;

    # ---- SSL (obtain via certbot: sudo certbot --nginx -d example-domain.com -d www.example-domain.com) ----
    ssl_certificate     /etc/letsencrypt/live/example-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- Security headers ----
    add_header X-Frame-Options        "SAMEORIGIN"                           always;
    add_header X-Content-Type-Options "nosniff"                              always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ---- Upload / body size ----
    client_max_body_size 25M;

    # ---- Proxy /api to FastAPI backend (running on 127.0.0.1:8001) ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Long-cache the hashed CRA static bundles ----
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- Favicon / manifest / robots — short cache ----
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|txt|webmanifest|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- React Router SPA fallback ----
    # Any URL that isn't a real file falls back to index.html so react-router-dom handles it.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html itself should NOT be cached, so users always get the newest bundle references.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---- Deny access to hidden files (.env, .git, etc.) ----
    location ~ /\. {
        deny all;
        return 404;
    }
}
